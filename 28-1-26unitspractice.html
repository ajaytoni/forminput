<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>units practice</title>
    <style>
        h1{
            font-size: 50px;   /* px unit */
        }
        p{
          color: blue;  font-size: 1.2em;  /* em unit */
        }
        div{
            width: 60%;    /* percentage */
            background-color: lightgreen;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div>
        <h1>Heading Text</h1>
        <p>Paragraph text</p>
    </div>
    
</body>
</html>
