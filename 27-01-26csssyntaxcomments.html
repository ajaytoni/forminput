<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css syntax practice</title>
    <style>
        /* this styles the heading */
        h1 {
            color: blue;
            font-size: 100px;
        }
        /* this styles the paragraph */
        p {
            color: green;
            font-size: 80px;
        }
    </style>
</head>
<body>
    <h1> Hello css</h1>
    <p>this is a paragraph</p>
</body>
</html>
